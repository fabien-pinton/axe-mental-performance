<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXE Mensuel — Préparation Mentale Continue</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#A8852A;--gold-light:#C9A84C;--gold-dark:#7A6020;--gold-xdark:#5A4418;
  --gold-faint:rgba(168,133,42,0.07);
  --bg:#F8F4EE;--bg-2:#F2EDE4;--bg-3:#EAE3D8;--bg-4:#E2D9CC;--bg-card:#FDFAF5;
  --border:rgba(168,133,42,0.18);--border-strong:rgba(168,133,42,0.32);
  --ink:#1C1510;--ink-dim:#5A4E3E;--ink-faint:#C8BFB0;
  --red:#C0392B;--success:#27AE60;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden;}
button,select,input{cursor:pointer;}
::-webkit-scrollbar{width:2px;}::-webkit-scrollbar-thumb{background:var(--gold-xdark);}

/* ── INTRO ── */
#intro{position:fixed;inset:0;background:#F5F0E8;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.2s ease;pointer-events:all;overflow:hidden;}
#intro::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 50%,rgba(168,133,42,0.1) 0%,transparent 70%);pointer-events:none;}
.intro-axe{font-family:'Bebas Neue',sans-serif;font-size:clamp(80px,16vw,180px);color:transparent;-webkit-text-stroke:2px var(--gold-dark);letter-spacing:0.18em;line-height:1;animation:revealText 1.8s ease forwards 0.4s;opacity:0;position:relative;z-index:1;}
.intro-sub{font-family:'Cormorant Garamond',serif;font-size:clamp(12px,1.8vw,18px);letter-spacing:0.45em;text-transform:uppercase;color:var(--ink-dim);margin-top:12px;opacity:0;animation:fadeUp 1s ease forwards 1.8s;position:relative;z-index:1;}
.intro-tag{font-size:11px;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;margin-top:8px;opacity:0;animation:fadeUp 1s ease forwards 2.2s;font-family:'Cormorant Garamond',serif;position:relative;z-index:1;}
.intro-divider{width:1px;height:0;background:linear-gradient(to bottom,var(--gold),transparent);margin:36px auto;animation:growLine 1s ease forwards 2.6s;position:relative;z-index:1;}
.intro-btn{opacity:0;background:var(--gold);border:none;color:#1C1510;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.3em;text-transform:uppercase;padding:16px 52px;transition:background 0.3s;position:relative;z-index:10;margin-top:8px;animation:fadeUp 1s ease forwards 3s;}
.intro-btn:hover{background:var(--gold-light);}
@keyframes revealText{from{opacity:0;transform:scaleX(0.85);letter-spacing:0.05em;}to{opacity:1;transform:scaleX(1);letter-spacing:0.18em;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes growLine{to{height:70px;}}

/* ── HEADER ── */
header{position:fixed;top:0;left:0;right:0;z-index:100;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:rgba(248,244,238,0.97);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);box-shadow:0 1px 0 var(--border),0 4px 24px rgba(0,0,0,0.06);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.25em;color:var(--gold);line-height:1;}
.logo span{font-family:'Cormorant Garamond',serif;font-size:9px;letter-spacing:0.35em;color:var(--ink-dim);display:block;text-transform:uppercase;margin-top:2px;}
.header-center{font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:var(--ink-dim);}
.header-right{display:flex;align-items:center;gap:12px;}
.month-badge{background:rgba(168,133,42,0.06);border:1px solid var(--border-strong);padding:5px 14px;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:0.2em;color:var(--gold);}
.sync-status{font-size:10px;color:var(--ink-faint);letter-spacing:0.1em;min-width:120px;text-align:right;}
@media(max-width:768px){header{padding:0 18px;}.header-center{display:none;}}

/* ── LAYOUT ── */
.main-wrap{padding-top:68px;display:grid;grid-template-columns:280px 1fr;min-height:100vh;}

/* ── SIDEBAR ── */
.sidebar{border-right:1px solid var(--border);background:var(--bg-2);position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto;display:flex;flex-direction:column;}
.sidebar::-webkit-scrollbar{width:2px;}
.sb-top{padding:20px;border-bottom:1px solid var(--border);}
.sb-tag{font-size:9px;letter-spacing:0.4em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
.sb-profil{background:var(--bg-card);border:1px solid var(--border);padding:14px 16px;margin-bottom:12px;}
.sb-profil-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:0.1em;color:var(--gold);}
.sb-profil-age{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px;}
.sb-nav{padding:16px 0;flex:1;}
.sb-section-title{font-size:8px;letter-spacing:0.45em;text-transform:uppercase;color:var(--gold);padding:0 20px;margin-bottom:8px;margin-top:16px;}
.sb-module{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;transition:background 0.2s;border-left:3px solid transparent;position:relative;}
.sb-module:hover{background:var(--bg-3);}
.sb-module.active{background:var(--bg-card);border-left-color:var(--gold);}
.sb-module.locked{opacity:0.4;cursor:not-allowed;}
.sb-module.done{border-left-color:var(--success);}
.sb-module-num{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);width:28px;flex-shrink:0;}
.sb-module.locked .sb-module-num{color:var(--ink-faint);}
.sb-module.done .sb-module-num{color:var(--success);}
.sb-module-info{}
.sb-module-title{font-size:11px;font-weight:500;color:var(--ink);letter-spacing:0.05em;}
.sb-module.active .sb-module-title{color:var(--gold);}
.sb-module-desc{font-size:10px;color:var(--ink-dim);margin-top:2px;}
.sb-lock-icon{position:absolute;right:16px;font-size:12px;color:var(--ink-faint);}
.sb-bottom{padding:16px 20px;border-top:1px solid var(--border);margin-top:auto;}
.sb-progress-label{font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;}
.sb-progress-track{height:2px;background:var(--bg-4);border-radius:1px;overflow:hidden;}
.sb-progress-fill{height:100%;background:linear-gradient(to right,var(--gold-dark),var(--gold-light));transition:width 0.4s ease;}

/* ── CONTENT ── */
.content{padding:48px 72px 100px;}
.section-tag{font-size:9px;letter-spacing:0.45em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:12px;}
.section-tag::after{content:'';flex:1;height:1px;background:var(--border);}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,5vw,56px);letter-spacing:0.04em;color:var(--ink);line-height:0.9;margin-bottom:16px;}
.section-title em{color:var(--gold);font-style:normal;}
.section-sub{font-family:'Cormorant Garamond',serif;font-size:clamp(16px,1.8vw,20px);font-style:italic;color:var(--ink-dim);line-height:1.65;max-width:640px;margin-bottom:40px;}
.module-pane{display:none;}
.module-pane.active{display:block;}

/* ── CARDS ── */
.card{background:var(--bg-card);border:1px solid var(--border);padding:28px 32px;margin-bottom:16px;}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:0.1em;color:var(--gold);margin-bottom:10px;}
.card-desc{font-size:14px;color:var(--ink-dim);line-height:1.75;}

/* ── EXERCICE ── */
.exo{display:grid;grid-template-columns:56px 1fr;gap:20px;background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--gold);padding:24px 28px;margin-bottom:14px;}
.exo-num{font-family:'Bebas Neue',sans-serif;font-size:40px;color:rgba(168,133,42,0.15);line-height:1;}
.exo-title{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:0.08em;color:var(--gold-dark);margin-bottom:8px;}
.exo-desc{font-size:14px;color:var(--ink-dim);line-height:1.75;margin-bottom:12px;}
.exo-focus{padding:10px 14px;background:var(--bg-2);border-left:2px solid var(--gold);display:flex;gap:10px;align-items:flex-start;}
.focus-label{font-size:8px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold-dark);flex-shrink:0;margin-top:2px;}
.focus-text{font-family:'Cormorant Garamond',serif;font-size:14px;font-style:italic;color:var(--ink-dim);line-height:1.5;}

/* ── MANTRA ── */
.mantra-block{background:var(--ink);padding:32px 36px;text-align:center;position:relative;overflow:hidden;margin:32px 0;}
.mantra-block::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,transparent,var(--gold),transparent);}
.mantra-label{font-size:8px;letter-spacing:0.4em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.mantra-text{font-family:'Cormorant Garamond',serif;font-size:clamp(18px,2.5vw,26px);font-style:italic;color:#F5F0E8;line-height:1.5;}

/* ── NOTES ── */
.note-block{background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--gold-dark);padding:20px 24px;margin:24px 0;}
.note-label{font-size:9px;letter-spacing:0.35em;text-transform:uppercase;color:var(--gold-dark);margin-bottom:10px;}
.note-ta{width:100%;background:var(--bg-2);border:1px solid var(--border);padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink);resize:vertical;min-height:90px;outline:none;transition:border 0.3s;line-height:1.6;}
.note-ta:focus{border-color:var(--gold);}
.note-save{font-size:9px;letter-spacing:0.22em;text-transform:uppercase;background:var(--gold);color:#FDFAF5;border:none;padding:8px 18px;margin-top:8px;font-family:'DM Sans',sans-serif;transition:background 0.3s;}
.note-save:hover{background:var(--gold-dark);}

/* ── PDF BTN ── */
.pdf-btn{display:flex;align-items:center;justify-content:center;gap:10px;font-size:9px;font-weight:500;letter-spacing:0.25em;text-transform:uppercase;background:transparent;border:1px solid var(--border-strong);color:var(--gold-dark);padding:11px 20px;width:100%;margin:16px 0;font-family:'DM Sans',sans-serif;transition:all 0.3s;}
.pdf-btn:hover{background:var(--gold);color:#FDFAF5;border-color:var(--gold);}

/* ── COMPLETE BTN ── */
.complete-btn{width:100%;background:var(--ink);border:none;color:var(--gold);font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:0.2em;padding:18px;margin-top:40px;transition:all 0.3s;}
.complete-btn:hover{background:var(--gold);color:var(--ink);}
.complete-btn.done-btn{background:var(--bg-3);border:1px solid var(--success);color:var(--success);cursor:default;}

/* ── RDV BLOCK ── */
.rdv-block{background:var(--ink);padding:36px 40px;text-align:center;position:relative;overflow:hidden;margin-top:40px;}
.rdv-btn{display:inline-block;font-size:10px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;background:var(--gold);color:#1C1510;text-decoration:none;padding:14px 36px;font-family:'DM Sans',sans-serif;transition:all .3s;margin-bottom:0;}
.rdv-btn:hover{background:var(--gold-light);}

/* ── AGE SELECTOR ── */
.age-selector{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;}
.age-chip{padding:7px 16px;border:1px solid var(--border);background:var(--bg-card);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--ink-dim);cursor:pointer;transition:all 0.2s;}
.age-chip:hover{border-color:var(--gold);color:var(--gold);}
.age-chip.sel{background:var(--gold);border-color:var(--gold);color:#1C1510;}

/* ── PROFIL SELECTOR ── */
.profil-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0;}
.profil-chip{padding:16px 14px;border:1px solid var(--border);background:var(--bg-card);cursor:pointer;transition:all 0.2s;text-align:left;}
.profil-chip:hover{border-color:var(--gold-dark);}
.profil-chip.sel{border-color:var(--gold);background:rgba(168,133,42,0.06);}
.pc-emoji{font-size:22px;margin-bottom:8px;}
.pc-name{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.08em;color:var(--gold);}
.pc-desc{font-size:11px;color:var(--ink-dim);margin-top:4px;line-height:1.5;}

/* ── TIMELINE ── */
.timeline{display:flex;gap:0;margin:32px 0;overflow-x:auto;padding-bottom:8px;}
.tl-month{flex:1;min-width:120px;padding:16px 14px;border:1px solid var(--border);border-right:none;background:var(--bg-card);position:relative;}
.tl-month:last-child{border-right:1px solid var(--border);}
.tl-month.current{background:rgba(168,133,42,0.06);border-color:var(--gold);}
.tl-month.done-m{background:var(--bg-2);}
.tl-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold-dark);line-height:1;}
.tl-month.current .tl-num{color:var(--gold);}
.tl-title{font-size:10px;font-weight:500;color:var(--ink);margin:4px 0 2px;letter-spacing:0.05em;}
.tl-sub{font-size:10px;color:var(--ink-faint);}
.tl-badge{position:absolute;top:10px;right:10px;font-size:8px;letter-spacing:0.2em;text-transform:uppercase;background:var(--gold);color:#1C1510;padding:2px 8px;}

/* ── TOAST ── */
.toast{position:fixed;top:84px;right:24px;z-index:9999;background:var(--bg-card);border:1px solid var(--border-strong);padding:16px 20px;max-width:300px;box-shadow:0 8px 32px rgba(0,0,0,0.12);transform:translateX(120%);transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);}
.toast.show{transform:translateX(0);}
.toast-title{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.2em;color:var(--gold);margin-bottom:4px;}
.toast-msg{font-size:12px;color:var(--ink-dim);line-height:1.5;}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .main-wrap{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .content{padding:32px 20px 80px;}
  .exo{grid-template-columns:1fr;}
  .exo-num{display:none;}
}
@media print{
  header,.sidebar,.complete-btn,.pdf-btn,.note-save,#intro{display:none!important;}
  .content{padding:20px;}
  .module-pane{display:block!important;}
  body{background:white;}
}
</style>
</head>

// STATE
// ═══════════════════════════════════════════════════════
let state = {
  prenom: '',
  nom: '',
  email: '',
  profil: null,
  age: null,
  currentModule: 0,
  completedModules: [],
  notes: {},
};

// Restore from localStorage
try {
  const saved = localStorage.getItem('axe-mensuel-state');
  if (saved) Object.assign(state, JSON.parse(saved));
} catch(e) {}

// ═══════════════════════════════════════════════════════
// SAVE
// ═══════════════════════════════════════════════════════
let _saveTimeout = null;
function saveState() {
  try { localStorage.setItem('axe-mensuel-state', JSON.stringify(state)); } catch(e) {}
  if (_saveTimeout) clearTimeout(_saveTimeout);
  _saveTimeout = setTimeout(() => syncCloud(), 1500);
}

async function syncCloud() {
  const email = state.email;
  if (!email || !email.includes('@')) return;
  setSyncStatus('saving');
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/athletes?on_conflict=email', {
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify({ email, updated_at: new Date().toISOString(), mensuel_state: JSON.stringify(state) })
    });
    setSyncStatus(res.ok ? 'saved' : 'error');
  } catch(e) { setSyncStatus('error'); }
}

function setSyncStatus(s) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const map = { saving:{c:'var(--gold-dark)',t:'⏳ Sauvegarde...'}, saved:{c:'var(--success)',t:'✓ Sauvegardé'}, error:{c:'var(--red)',t:'⚠ Hors ligne'} };
  const d = map[s] || {c:'var(--ink-faint)',t:''};
  el.textContent = d.t; el.style.color = d.c;
  if (s === 'saved') setTimeout(() => { el.textContent = ''; }, 3500);
}

// ═══════════════════════════════════════════════════════
// APP START
// ═══════════════════════════════════════════════════════
function startApp() {
  const intro = document.getElementById('intro');
  intro.style.opacity = '0';
  intro.style.pointerEvents = 'none';
  setTimeout(() => intro.style.display = 'none', 1200);

  checkPendingUnlocks();
  if (!state.profil || !state.age) {
    showSetup();
  } else {
    buildAll();
    showModule(state.currentModule);
  }
}

// ═══════════════════════════════════════════════════════
// COMPLETE MODULE
// ═══════════════════════════════════════════════════════
function validateRDV(idx) {
  const dateInput = document.getElementById('rdvDate' + idx);
  if (!dateInput || !dateInput.value) {
    showToast('Date manquante', 'Entre la date de ton RDV pour valider.');
    return;
  }
  const rdvDate = new Date(dateInput.value);
  const unlockDate = new Date(rdvDate);
  unlockDate.setDate(unlockDate.getDate() + 1); // J+1

  // Save RDV date and unlock date
  if (!state.rdvDates) state.rdvDates = {};
  state.rdvDates['m' + idx] = {
    rdv: rdvDate.toISOString().split('T')[0],
    unlock: unlockDate.toISOString().split('T')[0]
  };

  // Check if unlock date has passed
  const today = new Date().toISOString().split('T')[0];
  if (unlockDate.toISOString().split('T')[0] <= today) {
    // Already past J+1 — unlock immediately
    completeModule(idx);
  } else {
    // Not yet — save and inform
    if (!state.completedModules.includes(idx)) {
      state.completedModules.push(idx);
    }
    saveState();
    const unlockStr = unlockDate.toLocaleDateString('fr-FR', {day:'numeric', month:'long'});
    showToast('RDV enregistré ✓', 'Le module ' + (idx+2) + ' se débloquera le ' + unlockStr + '.');
    buildSidebar();
    showModule(idx); // refresh current
  }
}

function checkPendingUnlocks() {
  if (!state.rdvDates) return;
  const today = new Date().toISOString().split('T')[0];
  Object.entries(state.rdvDates).forEach(([key, dates]) => {
    if (dates.unlock <= today) {
      const idx = parseInt(key.replace('m',''));
      if (!state.completedModules.includes(idx)) {
        state.completedModules.push(idx);
      }
    }
  });
  saveState();
}

function completeModule(idx) {
  if (!state.completedModules.includes(idx)) {
    state.completedModules.push(idx);
    saveState();
  }

  if (idx < MODULES_DATA.length - 1) {
    showToast('Module ' + (idx+1) + ' complété ✓', 'Réserve ton RDV débrief pour débloquer le module suivant.');
    buildSidebar();
    showModule(idx + 1);
  } else {
    showCompletion();
  }
}

  document.getElementById('mainContent').innerHTML = `

(async function checkAccess() {
  const params = new URLSearchParams(window.location.search);
  const adminKey = params.get('admin');
  const token = params.get('token');
  const sessionOk = sessionStorage.getItem('axe-mensuel-token');

  if (adminKey === ADMIN_KEY) {
    sessionStorage.setItem('axe-mensuel-token', 'admin');
    return;
  }
  if (sessionOk) return;
  if (!token) {
    document.body.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#F5F0E8;flex-direction:column;gap:20px;text-align:center;padding:40px;font-family:'DM Sans',sans-serif;">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:56px;color:#C9A84C;letter-spacing:.15em;">AXE</div>
        <div style="width:40px;height:1px;background:#C9A84C;opacity:.4;margin:0 auto;"></div>
        <p style="color:#8A7E6E;font-size:11px;letter-spacing:.3em;text-transform:uppercase;">Accès réservé</p>
        <p style="color:#5A4E3E;font-size:13px;max-width:360px;line-height:1.8;">Ce programme est accessible uniquement aux abonnés AXE Mensuel. Si vous êtes déjà abonné, utilisez le lien reçu par email.</p>
        <a href="https://fabien-pinton.fr" style="color:#C9A84C;font-size:10px;letter-spacing:.25em;text-transform:uppercase;text-decoration:none;border:1px solid rgba(201,168,76,.25);padding:14px 32px;margin-top:12px;">← Retour au site</a>
      </div>`;
    return;
  }
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/athletes?token=eq.' + encodeURIComponent(token) + '&select=email,subscription_status,access_until&limit=1',
      { headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY} });
    const data = await res.json();
    if (!data || !data.length) { showAccessDenied(); return; }
    const session = data[0];
    const accessUntil = session.access_until ? new Date(session.access_until) : null;
    if (session.subscription_status !== 'active' || (accessUntil && accessUntil < new Date())) { showAccessDenied('Abonnement inactif', 'Votre accès a expiré. Contactez Fabien pour le réactiver.'); return; }
    sessionStorage.setItem('axe-mensuel-token', token);
    if (session.email) state.email = session.email;
  } catch(e) {
    if (token) sessionStorage.setItem('axe-mensuel-token', token);
  }
})();

}
