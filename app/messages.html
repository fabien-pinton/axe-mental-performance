<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — AXE Mental Performance®</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .thread{display:flex;flex-direction:column;gap:14px;margin:24px 0;min-height:300px;}
  .bubble{max-width:78%;padding:14px 18px;font-size:14px;line-height:1.6;}
  .bubble small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;opacity:.6;}
  .b-pilote{align-self:flex-end;background:var(--gold);color:var(--cream2);}
  .b-coach{align-self:flex-start;background:var(--cream2);border:1px solid var(--bdr2);color:var(--ink);}
  .composer{display:flex;gap:10px;align-items:flex-end;position:sticky;bottom:0;background:var(--cream);padding:14px 0;}
  .composer textarea{flex:1;margin:0;min-height:54px;}
  .empty{text-align:center;color:var(--inkf);padding:50px 0;font-family:'Cormorant Garamond';font-style:italic;font-size:18px;}
</style>
</head>
<body>
<nav class="app-nav">
  <a class="app-logo" href="programme.html">AXE MENTAL PERFORMANCE®<span>Espace athlète</span></a>
  <div class="app-links">
    <a class="app-link" href="programme.html">Programme</a>
    <a class="app-link active" href="messages.html">Messages</a>
    <button class="app-logout" onclick="deco()">Déconnexion</button>
  </div>
</nav>

<div class="wrap">
  <div class="eyebrow">Ta ligne directe</div>
  <h1 class="title">Une question pour <em>Fabien ?</em></h1>
  <p class="subtitle">Pose tes questions quand tu veux — sur un exercice, un ressenti, une difficulté. Fabien te répond ici. Tout l'historique est conservé.</p>

  <div class="thread" id="thread"></div>

  <div class="composer">
    <textarea class="in" id="msgInput" placeholder="Écris ton message…"></textarea>
    <button class="btn" onclick="envoyer()" id="btnSend">Envoyer →</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
let USER=null;

(async()=>{
  const u=await exigerConnexion();if(!u)return;USER=u;
  await charger();
  // marque les messages du coach comme lus
  await sb.from('messages').update({lu:true}).eq('user_id',USER.id).eq('auteur','coach');
})();

async function charger(){
  const {data}=await sb.from('messages').select('*').eq('user_id',USER.id).order('cree_le',{ascending:true});
  const t=document.getElementById('thread');
  if(!data||!data.length){t.innerHTML='<div class="empty">Aucun message pour l\'instant.<br>Lance la conversation ci-dessous.</div>';return;}
  t.innerHTML=data.map(m=>{
    const who=m.auteur==='coach'?'b-coach':'b-pilote';
    const nom=m.auteur==='coach'?'Fabien':'Toi';
    const d=new Date(m.cree_le).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    return '<div class="bubble '+who+'"><small>'+nom+' · '+d+'</small>'+escapeHtml(m.contenu)+'</div>';
  }).join('');
  t.scrollIntoView(false);
  window.scrollTo(0,document.body.scrollHeight);
}

async function envoyer(){
  const txt=document.getElementById('msgInput').value.trim();
  if(!txt)return;
  const b=document.getElementById('btnSend');b.disabled=true;
  const {error}=await sb.from('messages').insert({user_id:USER.id,auteur:'pilote',contenu:txt});
  b.disabled=false;
  if(error)return;
  document.getElementById('msgInput').value='';
  await charger();
}

function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
async function deco(){await sb.auth.signOut();location.href='index.html';}
</script>
</body>
</html>
