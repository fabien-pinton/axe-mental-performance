<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon profil — AXE Mental Performance®</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="app-nav">
  <a class="app-logo" href="#">AXE MENTAL PERFORMANCE®<span>Espace athlète</span></a>
  <div class="app-links"><button class="app-logout" onclick="deco()">Déconnexion</button></div>
</nav>

<div class="wrap">
  <div class="eyebrow">Étape 1 · Ton identité</div>
  <h1 class="title">Avant de commencer,<br><em>apprenons à te connaître.</em></h1>
  <p class="subtitle">Ces informations adaptent tes 25 questions, ton rapport et tes 24 semaines à ton âge et à ta discipline. Une seule fois.</p>

  <div id="msg"></div>

  <div class="card card-gold">
    <div class="row">
      <div style="flex:1;min-width:160px">
        <label class="fld">Prénom</label>
        <input class="in" id="prenom" placeholder="Ton prénom">
      </div>
      <div style="flex:1;min-width:160px">
        <label class="fld">Nom</label>
        <input class="in" id="nom" placeholder="Ton nom">
      </div>
    </div>

    <div class="row">
      <div style="flex:1;min-width:160px">
        <label class="fld">Email</label>
        <input class="in" type="email" id="email" placeholder="ton@email.com">
      </div>
      <div style="flex:1;min-width:160px">
        <label class="fld">Téléphone</label>
        <input class="in" type="tel" id="telephone" placeholder="06 12 34 56 78">
      </div>
    </div>

    <label class="fld">Ton âge</label>
    <div id="age"></div>

    <label class="fld">Genre</label>
    <div id="genre"></div>

    <label class="fld">Ta discipline / ton sport</label>
    <input class="in" id="sport" placeholder="Ex : tennis, judo, athlétisme, football…">

    <label class="fld">Ton niveau de compétition</label>
    <div id="niveau"></div>

    <button class="btn btn-full" id="btnGo" onclick="enregistrer()" style="margin-top:14px">Valider et accéder au diagnostic →</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
let SEL={age:null,genre:null,niveau:null};
const AGES=[['10-12','10 — 12 ans'],['12-15','12 — 15 ans'],['15-18','15 — 18 ans']];
const GENRES=[['homme','Homme'],['femme','Femme']];
const NIVEAUX=[['departemental','Départemental'],['regional','Régional'],['national','National'],['international','International']];

(async()=>{
  const ctx=await chargerProfil();
  if(!ctx)return;
  // pré-remplit si déjà renseigné
  const p=ctx.profil||{};
  if(p.prenom)document.getElementById('prenom').value=p.prenom;
  if(p.nom)document.getElementById('nom').value=p.nom;
  // email : depuis le profil, sinon depuis le compte de connexion
  document.getElementById('email').value=p.email||ctx.user.email||'';
  if(p.telephone)document.getElementById('telephone').value=p.telephone;
  if(p.sport)document.getElementById('sport').value=p.sport;
  SEL.age=p.tranche_age||null;SEL.genre=p.genre||null;SEL.niveau=p.niveau||null;
  render('age',AGES,'age');render('genre',GENRES,'genre');render('niveau',NIVEAUX,'niveau');
})();

function render(box,list,key){
  const el=document.getElementById(box);
  el.innerHTML=list.map(([v,lab])=>
    '<div class="opt '+(SEL[key]===v?'sel':'')+'" onclick="pick(\''+key+'\',\''+v+'\',this)">'+lab+'</div>'
  ).join('');
}
function pick(key,v,node){
  SEL[key]=v;
  [...node.parentNode.children].forEach(c=>c.classList.remove('sel'));
  node.classList.add('sel');
}

async function enregistrer(){
  const prenom=v('prenom'),nom=v('nom'),email=v('email'),telephone=v('telephone'),sport=v('sport');
  if(!prenom||!nom||!email||!telephone||!sport||!SEL.age||!SEL.genre||!SEL.niveau){
    return msg('Merci de remplir tous les champs.','err');
  }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    return msg('Merci de saisir un email valide.','err');
  }
  const b=document.getElementById('btnGo');b.disabled=true;b.textContent='Enregistrement…';
  const {data:u}=await sb.auth.getUser();
  const {error}=await sb.from('profils').update({
    prenom,nom,email,telephone,tranche_age:SEL.age,genre:SEL.genre,sport,niveau:SEL.niveau,questionnaire_ok:true
  }).eq('id',u.user.id);
  if(error){b.disabled=false;b.textContent='Valider et accéder au diagnostic →';return msg(error.message,'err');}
  window.location.href='diagnostic.html';
}

function v(id){return document.getElementById(id).value.trim();}
function msg(t,type){document.getElementById('msg').innerHTML='<div class="notice '+(type||'')+'">'+t+'</div>';}
async function deco(){await sb.auth.signOut();location.href='index.html';}
</script>
</body>
</html>
