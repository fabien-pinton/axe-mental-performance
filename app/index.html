<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXE Mental Performance® — Espace Pilote</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{display:flex;align-items:center;justify-content:center;background:var(--cream2);}
  .auth{width:100%;max-width:420px;padding:40px 24px;}
  .auth-logo{text-align:center;margin-bottom:36px;}
  .auth-logo .b{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.16em;color:var(--gold);}
  .auth-logo .s{font-family:'Cormorant Garamond',serif;font-size:11px;font-style:italic;color:var(--inkd);letter-spacing:.05em;margin-top:4px;}
  .tabs{display:flex;border:1px solid var(--bdr2);margin-bottom:28px;}
  .tab{flex:1;text-align:center;padding:14px;font-size:9px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--inkd);cursor:pointer;transition:all .25s;}
  .tab.act{background:var(--gold);color:var(--cream2);}
</style>
</head>
<body>
<div class="auth">
  <div class="auth-logo">
    <div class="b">AXE MENTAL PERFORMANCE®</div>
    <div class="s">L'espace de travail des pilotes — Fabien Pinton</div>
  </div>

  <div class="tabs">
    <div class="tab act" id="tabLogin" onclick="basc('login')">Connexion</div>
    <div class="tab" id="tabSignup" onclick="basc('signup')">Créer mon accès</div>
  </div>

  <div id="msg"></div>

  <!-- CONNEXION -->
  <div id="formLogin">
    <label class="fld">Email</label>
    <input class="in" type="email" id="lEmail" placeholder="ton@email.com">
    <label class="fld">Mot de passe</label>
    <input class="in" type="password" id="lPass" placeholder="••••••••">
    <button class="btn btn-full" id="btnLogin" onclick="connexion()">Accéder à mon espace →</button>
    <p class="muted center" style="margin-top:18px;cursor:pointer" onclick="reset()">Mot de passe oublié ?</p>
  </div>

  <!-- INSCRIPTION -->
  <div id="formSignup" class="hidden">
    <div class="notice" style="margin-bottom:22px">Ton accès est réservé après l'achat du programme (997 €). Crée ton compte avec l'email utilisé lors du paiement.</div>
    <label class="fld">Email</label>
    <input class="in" type="email" id="sEmail" placeholder="ton@email.com">
    <label class="fld">Mot de passe (8 caractères min.)</label>
    <input class="in" type="password" id="sPass" placeholder="••••••••">
    <button class="btn btn-full" id="btnSignup" onclick="inscription()">Créer mon accès →</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
initSupabase();

// déjà connecté ? → on route
(async()=>{
  const {data}=await sb.auth.getUser();
  if(data&&data.user){ routerApresAuth(); }
})();

function basc(t){
  document.getElementById('formLogin').classList.toggle('hidden',t!=='login');
  document.getElementById('formSignup').classList.toggle('hidden',t!=='signup');
  document.getElementById('tabLogin').classList.toggle('act',t==='login');
  document.getElementById('tabSignup').classList.toggle('act',t==='signup');
  msg('');
}
function msg(txt,type){
  const m=document.getElementById('msg');
  if(!txt){m.innerHTML='';return;}
  m.innerHTML='<div class="notice '+(type||'')+'">'+txt+'</div>';
}

async function inscription(){
  const email=val('sEmail'),pass=val('sPass');
  if(!email||pass.length<8){return msg('Email valide et mot de passe de 8 caractères minimum requis.','err');}
  const b=document.getElementById('btnSignup');b.disabled=true;b.textContent='Création…';
  const {data,error}=await sb.auth.signUp({email,password:pass});
  if(error){b.disabled=false;b.textContent='Créer mon accès →';return msg(traduireErr(error.message),'err');}
  // crée la ligne profil
  if(data.user){
    await sb.from('profils').upsert({id:data.user.id,email:email});
  }
  if(data.session){ routerApresAuth(); }
  else { msg('Compte créé. Vérifie ta boîte mail pour confirmer ton adresse, puis connecte-toi.','ok'); b.disabled=false;b.textContent='Créer mon accès →'; basc('login'); }
}

async function connexion(){
  const email=val('lEmail'),pass=val('lPass');
  if(!email||!pass){return msg('Renseigne ton email et ton mot de passe.','err');}
  const b=document.getElementById('btnLogin');b.disabled=true;b.textContent='Connexion…';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){b.disabled=false;b.textContent='Accéder à mon espace →';return msg(traduireErr(error.message),'err');}
  routerApresAuth();
}

async function reset(){
  const email=val('lEmail');
  if(!email){return msg('Saisis ton email ci-dessus, puis reclique sur « Mot de passe oublié ».','err');}
  const {error}=await sb.auth.resetPasswordForEmail(email);
  if(error){return msg(traduireErr(error.message),'err');}
  msg('Un lien de réinitialisation vient de t\'être envoyé par mail.','ok');
}

// Route le pilote selon son avancement
async function routerApresAuth(){
  const {data:u}=await sb.auth.getUser();
  // s'assure que la ligne profil existe
  let {data:p}=await sb.from('profils').select('*').eq('id',u.user.id).single();
  if(!p){ await sb.from('profils').insert({id:u.user.id,email:u.user.email}); p={}; }
  if(p.is_admin){ window.location.href='admin.html'; return; }
  if(!p.questionnaire_ok){ window.location.href='questionnaire.html'; return; }
  if(!p.diagnostic_ok){ window.location.href='diagnostic.html'; return; }
  window.location.href='programme.html';
}

function val(id){return document.getElementById(id).value.trim();}
function traduireErr(m){
  if(/Invalid login/i.test(m))return "Email ou mot de passe incorrect.";
  if(/already registered/i.test(m))return "Cet email a déjà un compte. Connecte-toi.";
  if(/Email not confirmed/i.test(m))return "Confirme d'abord ton email via le lien reçu par mail.";
  return m;
}
</script>
</body>
</html>
