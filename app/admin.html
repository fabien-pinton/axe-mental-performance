<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — AXE Mental Performance®</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .layout{display:grid;grid-template-columns:300px 1fr;gap:24px;}
  .athlètes{border-right:1px solid var(--bdr);padding-right:24px;}
  .pcard{padding:14px 16px;border:1px solid var(--bdr);background:var(--cream2);margin-bottom:8px;cursor:pointer;transition:all .2s;}
  .pcard:hover,.pcard.sel{border-color:var(--gold);background:var(--gold-xl);}
  .pcard .nom{font-family:'Bebas Neue';font-size:18px;letter-spacing:.04em;color:var(--ink);}
  .pcard .meta{font-size:11px;color:var(--inkf);margin-top:3px;}
  .pcard .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:6px;}
  .det-h{font-family:'Bebas Neue';font-size:32px;letter-spacing:.04em;color:var(--ink);margin-bottom:4px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .stat{background:var(--cream2);border:1px solid var(--bdr);padding:16px;}
  .stat .k{font-size:8px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  .stat .v{font-size:14px;color:var(--ink);line-height:1.4;}
  .wkrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bdr);background:var(--cream2);margin-bottom:7px;}
  .wkrow .num{font-family:'Bebas Neue';font-size:20px;color:var(--gold);width:34px;}
  .mini{font-size:7px;letter-spacing:.15em;text-transform:uppercase;padding:3px 7px;border-radius:10px;}
  .mini.y{background:rgba(61,122,78,.15);color:var(--green);}
  .mini.n{background:var(--cream4);color:var(--inkf);}
  .notebox{font-size:13px;color:var(--inkd);line-height:1.6;background:var(--cream3);padding:10px 12px;margin-top:6px;border-left:2px solid var(--gold);}
  .tabbtn{font-size:9px;letter-spacing:.2em;text-transform:uppercase;padding:9px 16px;border:1px solid var(--bdr2);background:none;cursor:pointer;color:var(--inkd);}
  .tabbtn.act{background:var(--gold);color:var(--cream2);border-color:var(--gold);}
  .bubble{max-width:80%;padding:12px 16px;font-size:13px;line-height:1.6;margin-bottom:10px;}
  .b-pilote{background:var(--cream2);border:1px solid var(--bdr2);}
  .b-coach{background:var(--gold);color:var(--cream2);margin-left:auto;}
  @media(max-width:860px){.layout{grid-template-columns:1fr;}.athlètes{border:none;padding:0;}.grid2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<nav class="app-nav">
  <a class="app-logo" href="#">AXE MENTAL PERFORMANCE®<span>Tableau de bord · Fabien</span></a>
  <div class="app-links"><button class="app-logout" onclick="deco()">Déconnexion</button></div>
</nav>

<div class="wrap-wide">
  <div class="eyebrow">Espace coach</div>
  <h1 class="title">Tes <em>athlètes.</em></h1>

  <div class="layout">
    <div class="athlètes" id="listeAthlètes"><div class="spin"></div></div>
    <div id="detail"><p class="muted">Sélectionne un athlète à gauche pour voir son suivi complet.</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="programme-data.js"></script>
<script>
let ATHLÈTES=[],sel=null,ongletCourant='suivi';

(async()=>{
  const ctx=await chargerProfil();
  if(!ctx)return;
  if(!ctx.profil||!ctx.profil.is_admin){location.href='programme.html';return;}
  await chargerAthlètes();
})();

async function chargerAthlètes(){
  const {data}=await sb.from('profils').select('*').eq('is_admin',false).order('cree_le',{ascending:false});
  ATHLÈTES=data||[];
  // compte messages non lus par athlète
  const {data:msgs}=await sb.from('messages').select('user_id').eq('auteur','pilote').eq('lu',false);
  const nonlus={};(msgs||[]).forEach(m=>nonlus[m.user_id]=(nonlus[m.user_id]||0)+1);
  const el=document.getElementById('listeAthlètes');
  if(!ATHLÈTES.length){el.innerHTML='<p class="muted">Aucun athlète inscrit pour l\'instant.</p>';return;}
  el.innerHTML=ATHLÈTES.map(p=>
    '<div class="pcard" onclick="voir(\''+p.id+'\')" id="pc_'+p.id+'">'+
    '<div class="nom">'+(p.prenom||'?')+' '+(p.nom||'')+(nonlus[p.id]?'<span class="dot"></span>':'')+'</div>'+
    '<div class="meta">'+(p.sport||'')+' · '+(p.niveau||'—')+' · '+(p.tranche_age||'—')+'</div></div>'
  ).join('');
}

async function voir(id){
  sel=ATHLÈTES.find(p=>p.id===id);
  document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('sel'));
  document.getElementById('pc_'+id).classList.add('sel');
  ongletCourant='suivi';
  render();
}

async function render(){
  const d=document.getElementById('detail');
  d.innerHTML='<div class="spin"></div>';
  // données
  const [{data:diag}, {data:prog}, {data:pres}, {data:debs}] = await Promise.all([
    sb.from('diagnostics').select('*').eq('user_id',sel.id).order('cree_le',{ascending:false}).limit(1),
    sb.from('progression').select('*').eq('user_id',sel.id).order('semaine'),
    sb.from('presentiels').select('*').eq('user_id',sel.id).order('cree_le',{ascending:false}),
    sb.from('debriefs').select('*').eq('user_id',sel.id).order('jalon')
  ]);
  const dg=(diag&&diag[0])||{};
  const semDispo=calcSemaine(sel);

  let html='<div class="det-h">'+(sel.prenom||'')+' '+(sel.nom||'')+'</div>'+
    '<p class="muted">'+(sel.email||'')+(sel.telephone?' · '+sel.telephone:'')+' · '+(sel.sport||'')+' · '+(sel.niveau||'')+' · '+(sel.tranche_age||'')+' ans · '+(sel.genre||'')+'</p>'+
    '<div class="row" style="margin:18px 0">'+
    '<button class="tabbtn '+(ongletCourant==='suivi'?'act':'')+'" onclick="onglet(\'suivi\')">Suivi 24 semaines</button>'+
    '<button class="tabbtn '+(ongletCourant==='diag'?'act':'')+'" onclick="onglet(\'diag\')">Diagnostic</button>'+
    '<button class="tabbtn '+(ongletCourant==='msg'?'act':'')+'" onclick="onglet(\'msg\')">Messages</button>'+
    '<button class="tabbtn '+(ongletCourant==='pres'?'act':'')+'" onclick="onglet(\'pres\')">Présentiels & visios</button>'+
    '</div>';

  if(ongletCourant==='suivi'){
    html+='<p class="muted" style="margin-bottom:14px">Semaine débloquée actuellement : <strong>'+semDispo+' / 24</strong></p>';
    const map={};(prog||[]).forEach(r=>map[r.semaine]=r);
    for(let i=1;i<=semDispo;i++){
      const r=map[i]||{};
      html+='<div class="wkrow"><div class="num">'+i+'</div><div style="flex:1">'+
        '<strong>'+SEMAINES[i-1].titre+'</strong> '+
        '<span class="mini '+(r.mental_fait?'y':'n')+'">Mental</span> '+
        '<span class="mini '+(r.seance_lundi_fait?'y':'n')+'">Lun</span> '+
        '<span class="mini '+(r.seance_jeudi_fait?'y':'n')+'">Jeu</span>'+
        (r.intensite_ressentie?' <span class="mini y">Intensité '+r.intensite_ressentie+'/10</span>':'')+
        (r.note_mental?'<div class="notebox"><strong>Note mental :</strong> '+esc(r.note_mental)+'</div>':'')+
        (r.ressenti?'<div class="notebox"><strong>Ressenti :</strong> '+esc(r.ressenti)+'</div>':'')+
        '</div></div>';
    }
  }

  if(ongletCourant==='diag'){
    if(!dg.profil_id){html+='<p class="muted">Diagnostic pas encore réalisé.</p>';}
    else{
      html+='<div class="grid2">'+
        stat('Profil mental',dg.profil_id)+
        stat('Point fort mental',dg.point_fort_mental)+
        stat('Point faible mental',dg.point_faible_mental)+
        stat('Point fort physique',dg.point_fort_physique)+
        stat('Point faible physique',dg.point_faible_physique)+
        stat('Scores (stress/peur/conf/plaisir/compét)',
          dg.score_stress+' · '+dg.score_peur+' · '+dg.score_confiance+' · '+dg.score_plaisir+' · '+dg.score_compet)+
      '</div>';
    }
  }

  if(ongletCourant==='msg'){
    const {data:ms}=await sb.from('messages').select('*').eq('user_id',sel.id).order('cree_le');
    await sb.from('messages').update({lu:true}).eq('user_id',sel.id).eq('auteur','pilote');
    html+='<div id="thread" style="display:flex;flex-direction:column;margin-bottom:16px">';
    if(!ms||!ms.length)html+='<p class="muted">Aucun message.</p>';
    else html+=ms.map(m=>{
      const d=new Date(m.cree_le).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
      return '<div class="bubble '+(m.auteur==='coach'?'b-coach':'b-pilote')+'"><small style="opacity:.6;display:block;margin-bottom:4px">'+(m.auteur==='coach'?'Toi':sel.prenom)+' · '+d+'</small>'+esc(m.contenu)+'</div>';
    }).join('');
    html+='</div><textarea class="in" id="reply" placeholder="Ta réponse…"></textarea>'+
      '<button class="btn" onclick="repondre()">Envoyer la réponse →</button>';
  }

  if(ongletCourant==='pres'){
    html+='<div class="stat" style="margin-bottom:18px"><div class="k">Débriefs visio (toutes les 8 semaines)</div>';
    const mapD={};(debs||[]).forEach(x=>mapD[x.jalon]=x);
    html+='<div style="margin-top:10px">';
    [8,16,24].forEach(j=>{
      const x=mapD[j];
      const st=x?x.statut:'—';
      const cls=(st==='confirme'||st==='fait')?'y':'n';
      html+='<div class="wkrow"><div class="num">S'+j+'</div><div style="flex:1">'+
        'Débrief de fin de bloc <span class="mini '+cls+'">'+st+'</span></div>'+
        (x&&st==='demande'?'<button class="tabbtn" onclick="confirmerDebrief(\''+x.id+'\')">Confirmer</button>':'')+
        (x&&st==='confirme'?'<button class="tabbtn" onclick="debriefFait(\''+x.id+'\')">Marquer fait</button>':'')+
        '</div>';
    });
    html+='</div></div>';

    html+='<div class="stat"><div class="k">Demandes de présentiel en compétition</div><div style="margin-top:10px">';
    if(!pres||!pres.length){html+='<p class="muted">Aucune demande de présentiel.</p>';}
    else{
      html+=pres.map(p=>
        '<div class="wkrow"><div style="flex:1"><strong>'+esc(p.competition||'')+'</strong><br>'+
        '<span class="muted">'+esc(p.adresse||'')+' · '+(p.distance_km||0)+' km · '+(p.tarif_eur||0)+' €</span><br>'+
        '<span class="mini '+(p.statut==='confirme'?'y':'n')+'">'+p.statut+'</span></div>'+
        (p.statut!=='confirme'?'<button class="tabbtn" onclick="confirmer(\''+p.id+'\')">Confirmer</button>':'')+
        '</div>'
      ).join('');
    }
    html+='</div></div>';
  }

  d.innerHTML=html;
}

function onglet(o){ongletCourant=o;render();}
function stat(k,v){return '<div class="stat"><div class="k">'+k+'</div><div class="v">'+(v||'—')+'</div></div>';}
function calcSemaine(p){if(!p.date_debut_programme)return 0;const j=Math.floor((Date.now()-new Date(p.date_debut_programme))/86400000);return Math.min(24,Math.max(1,Math.floor(j/7)+1));}

async function repondre(){
  const txt=document.getElementById('reply').value.trim();if(!txt)return;
  await sb.from('messages').insert({user_id:sel.id,auteur:'coach',contenu:txt});
  render();
}
async function confirmer(id){
  await sb.from('presentiels').update({statut:'confirme'}).eq('id',id);
  render();
}
async function confirmerDebrief(id){
  await sb.from('debriefs').update({statut:'confirme'}).eq('id',id);
  render();
}
async function debriefFait(id){
  await sb.from('debriefs').update({statut:'fait'}).eq('id',id);
  render();
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
async function deco(){await sb.auth.signOut();location.href='index.html';}
</script>
</body>
</html>
