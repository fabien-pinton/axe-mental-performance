    D: {

      ex: [
        { n: 'Squats enchaînés', c: 'Rythme régulier et souple, sans jamais bloquer les genoux en haut.', d: 60 },
        { n: 'Boxe : directs', c: 'En garde, coudes près du corps, on enchaîne les coups droits en alternance. Cadence soutenue.', d: 60 },

        { n: 'Boxe : crochets et uppercuts', c: 'Le buste tourne à chaque coup, les appuis restent en place. C’est la taille qui travaille.', d: 60 },
        { n: 'Fentes latérales alternées', c: 'Grand pas sur le côté, on s’assoit sur cette jambe, l’autre reste tendue. Alternez.', d: 60 },

        { n: 'Montées sur pointes', c: 'Debout, on monte lentement sur la pointe des pieds, 2 s en haut, descente lente. Les mollets brûlent, c’est normal.', d: 60 },
        { n: 'Mobilité et respiration', c: 'Cercles de hanches et d’épaules, puis grandes respirations. On redescend tranquillement.', d: 60 }
      ]
    },
    E: {
      key: 'E', day: 'Samedi', title: 'Gainage & souplesse', kind: 'blocks', tours: 2, rest: 20,
      intro: 'Séance douce du week-end : on renforce la sangle profonde et on rend au dos la souplesse que la semaine lui a prise.',
      ex: [
        { n: 'Planche sur les avant-bras', c: 'Corps en ligne, nombril rentré. Genoux au sol si nécessaire.', d: 30 },
        { n: 'Dead bug', c: 'Lent, le bas du dos plaqué au sol.', d: 40 },
        { n: 'Planche latérale droite', c: 'Bassin haut, épaules alignées.', d: 20 },
        { n: 'Planche latérale gauche', c: 'Même chose de l’autre côté.', d: 20 },
        { n: 'Pont fessier', c: 'Montée en serrant les fessiers, 2 s en haut, descente lente.', d: 40 }
      ]
    },
    R: { key: 'R', day: 'Dimanche', title: 'Repos complet', kind: 'rest', intro: 'Jour off, et c’est une partie du programme : c’est pendant le repos que le muscle se reconstruit. Une balade si le cœur vous en dit, rien de plus. Demain matin, mètre ruban avant la séance.' }
  };

  var WEEKPLAN = ['R', 'A', 'D', 'B', 'D', 'C', 'E']; // index = getDay() : 0 dimanche

  var PHASES = [
    { i: 1, name: 'Reprise en douceur', weeks: [1, 3], work: 30, rest: 30, note: 'Versions faciles partout : planche sur les genoux, pompes au mur. L’objectif de ces trois semaines n’est pas la performance, c’est de ne rater aucun matin.' },
    { i: 2, name: 'On tient le rythme', weeks: [4, 7], work: 40, rest: 20, note: 'Même exercices, effort allongé et repos raccourci. C’est ici que la séance commence à compter.' },
    { i: 3, name: 'Un cran au-dessus', weeks: [8, 12], work: 45, rest: 15, note: 'On passe aux variantes difficiles listées sous chaque exercice. Toujours 15 minutes.' },
    { i: 4, name: 'Vitesse de croisière', weeks: [13, 16], work: 45, rest: 15, note: 'Rythme de phase 3, et un 3e tour optionnel les matins où ça va fort. Sinon on tient les 15 minutes jusqu’au 20 décembre.' }
  ];


  /* ------------------------------------------------------------- utilities */

  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var MOIS_C = ['janv', 'févr', 'mars', 'avr', 'mai', 'juin', 'juil', 'août', 'sept', 'oct', 'nov', 'déc'];

  function iso(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function dayDiff(a, b) { return Math.round((b - a) / 86400000); }
  function longDate(d) { return JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()]; }
  function shortDate(s) { var d = parse(s); return d.getDate() + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function mmss(s) { return String(Math.floor(s / 60)) + ':' + String(s % 60).padStart(2, '0'); }

  function mondayOf(d) { var x = new Date(d.getTime()); var g = (x.getDay() + 6) % 7; return addDays(x, -g); }

  function weekIndex(d) { // 1-based programme week, 0 if before
    var m0 = mondayOf(parse(START));
    var n = Math.floor(dayDiff(m0, mondayOf(d)) / 7) + 1;
    return n;
  }
  function phaseFor(w) {
    for (var i = 0; i < PHASES.length; i++) if (w >= PHASES[i].weeks[0] && w <= PHASES[i].weeks[1]) return PHASES[i];
    return w < 1 ? PHASES[0] : PHASES[PHASES.length - 1];
  }

  /* ------------------------------------------------------------------ state */

  var LOCAL_KEY = 'quinze-minutes-ensemble-v1';
  // Page hébergée : l'état est publié dans la page elle-même, donc partagé.
  // Fichier ouvert depuis l'ordinateur ou le téléphone : on retombe sur le
  // stockage du navigateur, qui reste propre à chaque appareil.
  var shared = !!(window.claude && typeof window.claude.use === 'function');
  var state = JSON.parse(document.getElementById('state').textContent);
  if (!shared) {
    try {
      var raw = window.localStorage.getItem(LOCAL_KEY);
      if (raw) { var ls = JSON.parse(raw); if (ls && ls.people && ls.people.length) state = ls; }
    } catch (e) { /* stockage indisponible : on repart de l'état par défaut */ }
  }
  if (!state.measures) state.measures = { a: [], b: [] };
  if (!state.done) state.done = {};
  var readOnly = false;
  var busy = false;

  function buildDoc(s) {
    var css = document.getElementById('css').textContent;
    var app = document.getElementById('app').textContent;
    return '<!doctype html>\n<html lang="fr">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>Quinze Minutes Ensemble</title>\n' +
      '<style id="css">' + css + '<\/style>\n</head>\n<body>\n<div id="root"></div>\n' +
      '<script id="state" type="application/json">' + JSON.stringify(s).replace(/</g, '\\u003c') + '<\/script>\n' +
      '<script id="app">' + app + '<\/script>\n</body>\n</html>';
  }

  function save(next, label) {
    if (readOnly || busy) return;
    state = next;
    if (!shared) {
      try { window.localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); }
      catch (e) { flash = 'Impossible d’enregistrer : le stockage de ce navigateur est bloqué (navigation privée ?).'; }
      render();
      return;
    }
    busy = true;
    render(label || 'Enregistrement…');
    window.claude.use('artifact').then(function (api) {
      if (!api) { readOnly = true; busy = false; render(); return; }
      return api.publish(buildDoc(state)).then(function () { /* la vue se recharge */ });
    }).catch(function (err) {
      busy = false;
      var code = err && err.code;
      if (code === 'conflict') return; // la vue se recharge sur la version gagnante
      if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') {
        readOnly = true;
      } else {
        flash = 'Enregistrement impossible pour le moment. Réessayez dans un instant.';
      }
      render();
    });
  }
  var flash = '';

  function clone() { return JSON.parse(JSON.stringify(state)); }

  /* ----------------------------------------------------------- computation */

  function sessionFor(d) { return SESSIONS[WEEKPLAN[d.getDay()]]; }

  function inProgram(d) { var s = parse(START), e = parse(END); return d >= s && d <= e; }

  function streak() {
    var d = new Date(); d.setHours(0, 0, 0, 0);
    if (!state.done[iso(d)]) d = addDays(d, -1);
    var n = 0, guard = 0;
    while (guard++ < 200) {
      if (!inProgram(d)) break;
      if (WEEKPLAN[d.getDay()] === 'R') { d = addDays(d, -1); continue; }
      if (state.done[iso(d)]) { n++; d = addDays(d, -1); } else break;
    }
    return n;
  }

  function countDone() { return Object.keys(state.done).filter(function (k) { return state.done[k]; }).length; }

  function weekDays(n) { // les jours de la semaine n qui appartiennent au programme
    var m0 = mondayOf(parse(START)), out = [];
    for (var i = 0; i < 7; i++) {
      var d = addDays(m0, (n - 1) * 7 + i);
      if (inProgram(d)) out.push(d);
    }
    return out;
  }
  var TOTAL_WEEKS = weekIndex(parse(END));
  var TOTAL_SESSIONS = (function () {
    var n = 0;
    for (var w = 1; w <= TOTAL_WEEKS; w++) weekDays(w).forEach(function (d) { if (WEEKPLAN[d.getDay()] !== 'R') n++; });
    return n;
  })();

  function measuresOf(pid) {
    var a = (state.measures[pid] || []).slice();
    a.sort(function (x, y) { return x.d < y.d ? -1 : 1; });
    return a;
  }

  /* -------------------------------------------------------------- sequence */

  function buildSequence(sess, phase, tours) {
    var seq = [];
    WARMUP.forEach(function (w) { seq.push({ k: 'warm', n: w.n, c: w.c, d: w.d }); });
    if (sess.kind === 'circuit') {
      var T = tours || sess.tours || 2;
      for (var t = 1; t <= T; t++) {
        sess.ex.forEach(function (e, i) {
          seq.push({ k: 'work', n: e.n, c: e.c, p: e.p, d: phase.work, tag: 'Tour ' + t + ' / ' + T });
          seq.push({ k: 'rest', n: 'Récupération', d: phase.rest });
        });
      }
    } else if (sess.kind === 'blocks') {
      var TT = sess.tours || 1;
      for (var u = 1; u <= TT; u++) {
        sess.ex.forEach(function (e, i) {
          seq.push({ k: 'work', n: e.n, c: e.c, p: e.p, d: e.d, tag: TT > 1 ? 'Tour ' + u + ' / ' + TT : '' });
          if (sess.rest) seq.push({ k: 'rest', n: 'Récupération', d: sess.rest });
        });
      }
    }
    (sess.key === 'E' ? COOLDOWN_LONG : COOLDOWN).forEach(function (w) { seq.push({ k: 'cool', n: w.n, c: w.c, d: w.d }); });

    // Chaque récupération embarque la fiche complète de l'exercice suivant :
    // nom, consigne et astuce sont lus AVANT que le chrono d'effort démarre.
    for (var j = 0; j < seq.length; j++) {
      if (seq[j].k !== 'rest') continue;
      var nx = seq[j + 1];
      if (!nx) { seq[j].next = 'Fin de séance'; continue; }
      seq[j].next = nx.n; seq[j].nc = nx.c; seq[j].np = nx.p; seq[j].nd = nx.d; seq[j].nk = nx.k;
    }
    return seq;
  }

  function totalOf(seq) { return seq.reduce(function (a, b) { return a + b.d; }, 0); }

  /* ---------------------------------------------------------------- charts */

  var chartMode = 'abs'; // 'abs' = centimètres bruts, 'delta' = écart depuis le départ

  function chart(w, h) {
    // L'axe du temps couvre tout le programme : la courbe se dessine
    // semaine après semaine, de la gauche vers le 20 décembre.
    var abs = chartMode === 'abs';
    var series = state.people.map(function (p, idx) {
      var m = measuresOf(p.id);
      var base = m.length ? m[0].v : 0;
      return {
        name: p.name, color: idx === 0 ? 'var(--pa)' : 'var(--pb)',
        pts: m.map(function (x) { return { t: parse(x.d).getTime(), v: abs ? x.v : Math.round((x.v - base) * 10) / 10 }; })
      };
    });
    var all = [];
    series.forEach(function (s) { s.pts.forEach(function (p) { all.push(p); }); });

    var x0 = parse(START).getTime(), x1 = parse(END).getTime();
    var v0, v1;
    if (all.length) {
      var vals = all.map(function (p) { return p.v; }).concat(abs ? [] : [0]);
      v0 = Math.min.apply(null, vals); v1 = Math.max.apply(null, vals);
      var pad = Math.max(1, (v1 - v0) * 0.25);
      v0 -= pad; v1 += pad;
    } else { v0 = abs ? 75 : -5; v1 = abs ? 105 : 1; }

    var L = 34, R = 12, T = 16, B = 26;
    function X(t) { return L + (t - x0) / (x1 - x0) * (w - L - R); }
    function Y(v) { return T + (v1 - v) / (v1 - v0) * (h - T - B); }
    var g = '';

    // lignes horizontales + graduations
    for (var i = 0; i <= 3; i++) {
      var vv = v0 + (v1 - v0) * i / 3, y = Y(vv);
      g += '<line x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (w - R) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>' +
        '<text x="' + (L - 6) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-3)">' +
        (abs ? vv.toFixed(0) : (vv > 0 ? '+' : '') + vv.toFixed(1)) + '</text>';
    }

    // repères de mois
    [[8, 'sept'], [9, 'oct'], [10, 'nov'], [11, 'déc']].forEach(function (mo) {
      var t = new Date(2026, mo[0], 1).getTime();
      if (t < x0 || t > x1) { if (mo[0] !== 8) return; t = x0; }
      var x = X(t);
      g += '<line x1="' + x.toFixed(1) + '" y1="' + T + '" x2="' + x.toFixed(1) + '" y2="' + (h - B) + '" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/>';
      g += '<text x="' + (x + 3).toFixed(1) + '" y="' + (h - 8) + '" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-3)">' + mo[1] + '</text>';
    });

    // ligne du zéro en mode écart
    if (!abs) {
      var yz = Y(0);
      g += '<line x1="' + L + '" y1="' + yz.toFixed(1) + '" x2="' + (w - R) + '" y2="' + yz.toFixed(1) + '" stroke="var(--line-strong)" stroke-width="1.5" stroke-dasharray="4 3"/>';
      g += '<text x="' + (w - R) + '" y="' + (yz - 5).toFixed(1) + '" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="9" fill="var(--ink-3)">départ</text>';
    }

    // repère « aujourd'hui »
    var now = new Date(); now.setHours(0, 0, 0, 0);
    if (now.getTime() >= x0 && now.getTime() <= x1) {
      var xt = X(now.getTime());
      g += '<line x1="' + xt.toFixed(1) + '" y1="' + T + '" x2="' + xt.toFixed(1) + '" y2="' + (h - B) + '" stroke="var(--clay)" stroke-width="1.5"/>';
    }

    // les deux courbes
    series.forEach(function (s) {
      if (!s.pts.length) return;
      if (s.pts.length > 1) {
        var dstr = s.pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1); }).join(' ');
        g += '<path d="' + dstr + '" fill="none" stroke="' + s.color + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
      }
      s.pts.forEach(function (p, i) {
        var last = i === s.pts.length - 1;
        g += '<circle cx="' + X(p.t).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="' + (last ? 4.5 : 2.6) + '" fill="' + s.color + '"' + (last ? ' stroke="var(--surface)" stroke-width="2"' : '') + '/>';
      });
      var lp = s.pts[s.pts.length - 1];
      var lx = X(lp.t), anchor = lx > L + 70 ? 'end' : 'start';
      g += '<text x="' + (anchor === 'end' ? lx - 8 : lx + 8).toFixed(1) + '" y="' + (Y(lp.v) - 9).toFixed(1) + '" text-anchor="' + anchor + '" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" fill="' + s.color + '">' + esc(s.name) + '</text>';
    });

    if (!all.length) {
      g += '<text x="' + (w / 2) + '" y="' + (h / 2) + '" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--ink-3)">la courbe démarre à votre première mesure</text>';
    }

    return '<div class="charthead">' +
      '<span class="eyebrow">' + (abs ? 'Tour de taille, en cm' : 'Écart depuis la 1<sup>re</sup> mesure') + '</span>' +
      '<span class="toggle">' +
      '<button class="mini' + (abs ? ' on' : '') + '" data-act="mode" data-m="abs">cm</button>' +
      '<button class="mini' + (abs ? '' : ' on') + '" data-act="mode" data-m="delta">Écart</button>' +
      '</span></div>' +
      '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto" role="img" aria-label="Évolution du tour de taille de ' +
      esc(state.people.map(function (p) { return p.name; }).join(' et ')) + ' du 1er septembre au 20 décembre">' + g + '</svg>';
  }

  // Liste d'exercices avec les récupérations, partagée par la carte du jour
  // et par le détail d'un jour dans la liste des séances.
  function exerciseList(sess, ph, withCues) {
    var seq = buildSequence(sess, ph);
    var tours = sess.kind === 'circuit' ? (sess.tours || 2) : (sess.tours || 1);
    var rest = sess.kind === 'circuit' ? ph.rest : (sess.rest || 0);
    var cool = mmss(totalOf(seq.filter(function (x) { return x.k === 'cool'; })));
    var o = ['<ul class="exlist">'];
    o.push('<li><span class="n">—</span><div><div class="nm">Échauffement</div>' +
      (withCues ? '<div class="cue">' + WARMUP.map(function (x) { return esc(x.n); }).join(' · ') + '</div>' : '') +
      '</div><span class="t">3:00</span></li>');
    if (tours > 1) o.push('<li class="tour"><span class="n"></span><div><div class="rec">Le bloc ci-dessous, ' + tours + ' fois</div></div><span class="t"></span></li>');
    sess.ex.forEach(function (e, i) {
      var dur = sess.kind === 'circuit' ? ph.work + ' s' : e.d + ' s';
      o.push('<li><span class="n">' + (i + 1) + '</span><div><div class="nm">' + esc(e.n) + '</div>' +
        (withCues ? '<div class="cue">' + esc(e.c) + '</div>' : '') + '</div><span class="t">' + dur + '</span></li>');
      if (rest) o.push('<li class="recup"><span class="n"></span><div><div class="rec">Récupération</div></div><span class="t">' + rest + ' s</span></li>');
    });
    o.push('<li><span class="n">—</span><div><div class="nm">Étirements</div>' +
      (withCues ? '<div class="cue">' + (sess.key === 'E' ? COOLDOWN_LONG : COOLDOWN).map(function (x) { return esc(x.n); }).join(' · ') + '</div>' : '') +
      '</div><span class="t">' + cool + '</span></li>');
    o.push('</ul>');
    return o.join('');
  }

  /* ------------------------------------------------- liste de toutes les séances */

  // État d'ouverture de la liste : propre à chaque personne qui regarde,
  // jamais publié. La semaine en cours est dépliée d'entrée.
  var openWeeks = {};
  var openDays = {};
  (function () {
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var n = t < parse(START) ? 1 : (t > parse(END) ? TOTAL_WEEKS : weekIndex(t));
    openWeeks[n] = true;
  })();

  function allSessions(today, curWeek) {
    var out = ['<div class="weeks">'];
    for (var n = 1; n <= TOTAL_WEEKS; n++) {

  /* ------- moteur audio : bips, batterie, voix ------- */

  function actx() {
    if (!P) return null;
    try {
      if (!P.ac) P.ac = new (window.AudioContext || window.webkitAudioContext)();
      if (P.ac.state === 'suspended' && P.ac.resume) P.ac.resume();

  function tone(freq, dur, type, vol, when, glide) {
    var a = actx(); if (!a) return;
    try {
      var t = when || a.currentTime;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol || 0.2), t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(P.master);
      o.start(t); o.stop(t + dur + 0.04);
    } catch (e) {}
  }

  function hit(dur, vol, hz, when) { // bruit : charley, clap
    var a = actx(); if (!a) return;
    try {
      var t = when || a.currentTime;
      var n = Math.max(1, Math.floor(a.sampleRate * dur));
      var buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
      for (var i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var src = a.createBufferSource(); src.buffer = buf;
      var f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hz || 6000;
      var g = a.createGain(); g.gain.value = vol || 0.07;
      src.connect(f); f.connect(g); g.connect(P.master);
      src.start(t);
    } catch (e) {}
  }

  function fanfare(list, type, vol) {
    var a = actx(); if (!a) return;
    var t0 = a.currentTime;
    list.forEach(function (f, i) { tone(f, 0.22, type || 'triangle', vol || 0.22, t0 + i * 0.09); });
  }

  var BAR_ROOTS = [110, 110, 130.81, 98];
  var CD = [523.25, 587.33, 659.25, 739.99, 880];

  function beatStep(step, when, bar) {
    var v = P.beatVol, root = BAR_ROOTS[bar % 4];
    if (step === 0 || step === 4) { tone(150, 0.22, 'sine', 0.5 * v, when, 45); tone(root, 0.26, 'triangle', 0.13 * v, when); }
    if (step === 3) tone(150, 0.15, 'sine', 0.28 * v, when, 50);
    if (step === 4) hit(0.09, 0.06 * v, 1800, when);
    if (step % 2 === 1) hit(0.03, 0.045 * v, 8200, when);
    if (step === 6) { tone(root * 1.5, 0.2, 'triangle', 0.09 * v, when); hit(0.03, 0.055 * v, 8200, when); }
    if (step === 2) tone(root * 4, 0.13, 'triangle', 0.045 * v, when);
  }

  function schedBeat() {
    if (!P || !P.beatOn || !P.ac || P.paused) return;
    var spb = 60 / 124 / 2;
    if (P.beatNext < P.ac.currentTime) P.beatNext = P.ac.currentTime + 0.03;
    while (P.beatNext < P.ac.currentTime + 0.15) {
      beatStep(P.step, P.beatNext, P.bar);
      P.step++;
      if (P.step >= 8) { P.step = 0; P.bar++; }
      P.beatNext += spb;
    }
  }

  function startBeat(vol) {
    if (!P || !SND.music) return;

    if (P.beatOn) return;
    P.beatOn = true; P.step = 0; P.bar = 0;
    P.beatNext = a.currentTime + 0.06;
    if (!P.beatTimer) P.beatTimer = setInterval(schedBeat, 25);

  function stopBeat() { if (P) P.beatOn = false; }

      '<div class="pbody">' +
      '<div class="kind" id="p-kind"></div>' +
      '<div class="lbl" id="p-lbl"></div>' +
      '<div class="exname" id="p-name"></div>' +
      '<div class="clock" id="p-clock">00</div>' +
      '<div class="cue" id="p-cue"></div>' +
      '<div class="tip" id="p-tip" hidden></div>' +
      '<div class="hype" id="p-hype"></div>' +
      '<div class="next" id="p-next"></div>' +
      '</div>' +
      '<div class="pfoot"><button id="p-pause">Pause</button><button id="p-skip" class="ghost">Passer</button></div>';
    document.body.appendChild(el);
    P.el = el;
    document.body.style.overflow = 'hidden';

    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').then(function (l) { P.lock = l; }).catch(function () {});
    }

    function paintTog() {
      el.querySelector('#p-music').className = SND.music ? '' : 'off';
      el.querySelector('#p-voice').className = SND.voice ? '' : 'off';
    }
    paintTog();
    el.querySelector('#p-music').addEventListener('click', function () {
      SND.music = !SND.music; saveSnd(); paintTog();
      if (!SND.music) stopBeat();
      else { var s = P.seq[P.i]; if (s.k === 'work') startBeat(1); else if (s.k === 'warm') startBeat(0.55); }
    });
    el.querySelector('#p-voice').addEventListener('click', function () {
      SND.voice = !SND.voice; saveSnd(); paintTog();
      if (!SND.voice) shutUp();
    });
    el.querySelector('#p-quit').addEventListener('click', closePlayer);
    el.querySelector('#p-pause').addEventListener('click', function () {
      P.paused = !P.paused;
      this.textContent = P.paused ? 'Reprendre' : 'Pause';
      if (P.paused) { stopBeat(); shutUp(); }
      else { var s = P.seq[P.i]; if (s.k === 'work') startBeat(1); else if (s.k === 'warm') startBeat(0.55); }
    });
    el.querySelector('#p-skip').addEventListener('click', function () { next(); });

    fanfare([523.25, 659.25, 783.99], 'triangle', 0.2);
    paintStep();
    P.timer = setInterval(tick, 1000);
  }

  function goFlash(txt) {
    try {
      var f = document.createElement('div');
      f.className = 'goflash'; f.textContent = txt;
      document.body.appendChild(f);
      setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 780);
    } catch (e) {}
  }

  function kindLabel(k) {
    return k === 'warm' ? 'Échauffement' : k === 'cool' ? 'Étirement' : k === 'work' ? 'Effort' : '';
  }

  function paintStep() {
    var s = P.seq[P.i]; if (!s) return;
    var q = function (sel) { return P.el.querySelector(sel); };
    var isRest = s.k === 'rest' || s.k === 'ready';

    P.el.className = 'player' + (isRest ? ' is-rest' : '');
    q('#p-tag').textContent = (s.tag ? s.tag + ' · ' : '') + 'Étape ' + (P.i + 1) + '/' + P.seq.length;

    // pastilles : un point par exercice de la séance
    var dots = '';
    P.workIdx.forEach(function (ix) {
      dots += '<i class="' + (ix === P.i ? 'cur' : (ix < P.i ? 'on' : '')) + '"></i>';
    });
    q('#p-dots').innerHTML = dots;

    var tip = q('#p-tip');
    if (isRest) {
      // Écran de récupération : la fiche complète du mouvement SUIVANT,
      // lisible et lue à voix haute pendant qu'on souffle.
      q('#p-kind').textContent = s.k === 'ready' ? 'On y va dans' : 'Récupération';
      q('#p-lbl').textContent = 'Ensuite · ' + (kindLabel(s.nk) || 'Suite') + (s.nd ? ' ' + s.nd + ' s' : '');
      q('#p-name').textContent = s.next || 'Fin de séance';
      q('#p-cue').textContent = s.nc || '';
      q('#p-cue').className = 'cue big';
      if (s.np) { tip.textContent = 'Astuce · ' + s.np; tip.hidden = false; } else { tip.hidden = true; }
      q('#p-hype').textContent = '';
      var reste = P.workIdx.filter(function (ix) { return ix > P.i; }).length;
      q('#p-next').textContent = reste ? 'Il reste ' + reste + ' exercice' + (reste > 1 ? 's' : '') : 'Dernière ligne droite';
      stopBeat();
      tone(392, 0.3, 'sine', 0.16); tone(523.25, 0.34, 'sine', 0.12);
      shutUp();
      say('Ensuite : ' + (s.next || '') + '. ' + (s.nc || ''));
    } else {
      q('#p-kind').textContent = kindLabel(s.k);
      q('#p-lbl').textContent = s.tag || '';
      q('#p-name').textContent = s.n;
      q('#p-cue').textContent = s.c || '';
      q('#p-cue').className = 'cue';
      tip.hidden = true;
      q('#p-hype').textContent = s.k === 'work' ? HYPE[P.i % HYPE.length] : '';
      var nx = P.seq[P.i + 1];
      q('#p-next').textContent = nx ? 'Ensuite : ' + (nx.k === 'rest' ? 'récup ' + nx.d + ' s' : nx.n) : 'Dernière étape';
      if (s.k === 'work') {
        goFlash('GO !');
        fanfare([659.25, 880, 1318.51], 'square', 0.2);
        hit(0.12, 0.09, 1500);
        startBeat(1);
        shutUp(); say(s.n);
      } else if (s.k === 'warm') {
        tone(587.33, 0.18, 'triangle', 0.18);
        startBeat(0.55);
        shutUp(); say(s.n + '. ' + (s.c || ''));
      } else {
        stopBeat();
        tone(349.23, 0.4, 'sine', 0.14);
        shutUp(); say(s.n + '. ' + (s.c || ''));
      }
    }
    q('#p-ring').className = 'ring' + (isRest ? ' rest' : '');
    paintClock();
  }

  function paintClock() {
    var s = P.seq[P.i]; if (!s) return;
    var isRest = s.k === 'rest' || s.k === 'ready';
    var c = P.el.querySelector('#p-clock');
    var counting = P.left > 0 && P.left <= (isRest ? 5 : 3);
    c.textContent = String(P.left).padStart(2, '0');
    var base = 'clock' + (isRest ? ' rest' : '');
    c.className = base;
    if (counting) { void c.offsetWidth; c.className = base + ' count'; }
    P.el.classList.toggle('is-hot', counting);
    P.el.querySelector('#p-ring').firstChild.style.width = Math.round((1 - P.left / s.d) * 100) + '%';
  }

  function next() {
    P.i++;
    if (P.i >= P.seq.length) { finish(); return; }
    P.left = P.seq[P.i].d;
    paintStep();
  }

  function tick() {
    if (!P || P.paused) return;
    P.left--;
    var s = P.seq[P.i];
    if (P.left <= 0) { next(); return; }
    var isRest = s.k === 'rest' || s.k === 'ready';
    if (isRest) {
      if (P.left <= 5) { tone(CD[5 - P.left], 0.12, 'square', 0.2); hit(0.035, 0.06, 7000); }
      else if (P.left <= 10) hit(0.02, 0.035, 9000);
    } else {
      if (P.left <= 3) { tone(880 + (3 - P.left) * 120, 0.1, 'square', 0.22); hit(0.035, 0.06, 7000); }
      if (s.k === 'work' && s.d >= 30 && P.left === Math.round(s.d / 2)) {
        P.el.querySelector('#p-hype').textContent = HYPE[(P.i + 5) % HYPE.length];
        hit(0.06, 0.07, 2500);
      }
    }
    paintClock();
  }

  function confetti() {
    try {
      var box = document.createElement('div'); box.className = 'confetti';
      var cols = ['var(--accent)', 'var(--clay)', 'var(--pb)', 'var(--accent-ink)'];
      for (var i = 0; i < 46; i++) {
        var p = document.createElement('i');
        p.style.left = (Math.random() * 100).toFixed(1) + '%';
        p.style.background = cols[i % cols.length];
        p.style.animationDuration = (1.5 + Math.random() * 1.5).toFixed(2) + 's';
        p.style.animationDelay = (Math.random() * 0.6).toFixed(2) + 's';
        box.appendChild(p);
      }
      document.body.appendChild(box);
      setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 3800);
    } catch (e) {}
  }

  function finish() {
    stopBeat();
    var a = actx();
    if (a) {
      var t0 = a.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, 0.26, 'triangle', 0.24, t0 + i * 0.11); });
      tone(1318.51, 0.6, 'triangle', 0.2, t0 + 0.5);
      tone(659.25, 0.6, 'sine', 0.16, t0 + 0.5);
      hit(0.3, 0.09, 1200, t0 + 0.5);
    }
    shutUp(); say('Séance terminée. Bravo !');
    goFlash('BRAVO');
    confetti();
    var now = new Date(); now.setHours(0, 0, 0, 0);
    var t = iso(now);
    closePlayer();
    if (!readOnly && inProgram(now) && !state.done[t]) {
      var n = clone(); n.done[t] = true; save(n);
    }
  }

  function closePlayer() {
    if (!P) return;
    clearInterval(P.timer);
    if (P.beatTimer) clearInterval(P.beatTimer);
    P.beatOn = false;
    shutUp();
    if (P.lock && P.lock.release) { try { P.lock.release(); } catch (e) {} }
    if (P.el && P.el.parentNode) P.el.parentNode.removeChild(P.el);
    document.body.style.overflow = '';
    P = null;
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && P) closePlayer();
  });

  render();
})();
</script>

</body>
