<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accès · Le protocole AXE Mental Performance®</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1612;--cream:#FDFAF5;--gold:#A8852A;--line:rgba(26,22,18,.14);--dim:rgba(26,22,18,.6)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{max-width:440px;width:100%;text-align:center}
.axe-letters{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:44px;letter-spacing:.18em;color:var(--gold);padding-right:.18em;line-height:.9}
.axe-sub{font-family:'DM Sans';font-weight:600;font-size:9px;letter-spacing:.34em;color:var(--gold);margin:8px 0 0;padding-top:8px;border-top:1px solid rgba(168,133,42,.4);display:inline-block}
h1{font-family:'Bebas Neue';font-weight:400;font-size:34px;letter-spacing:.04em;margin:34px 0 6px}
.serif{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--dim);margin-bottom:30px}
input{width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:5px;font-family:'DM Sans';font-size:16px;background:#fff;color:var(--ink);text-align:center;letter-spacing:.05em}
input:focus{outline:none;border-color:var(--gold)}
button{width:100%;margin-top:14px;padding:15px;border:none;border-radius:5px;background:var(--ink);color:var(--cream);font-family:'DM Sans';font-weight:600;font-size:15px;letter-spacing:.03em;cursor:pointer;transition:.18s}
button:hover{background:#000}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:18px;font-size:14px;min-height:22px}
.msg.err{color:#9B2C2C}
.msg.ok{color:#5D6F4A}
.hint{margin-top:26px;font-size:12.5px;color:var(--dim);line-height:1.6}
.hint a{color:var(--gold)}
</style>
</head>
<body>
<div class="card">
  <div class="axe-letters">AXE</div>
  <div class="axe-sub">MENTAL PERFORMANCE®</div>
  <h1>TON ESPACE PILOTE</h1>
  <div class="serif">Entre ton code d'accès pour ouvrir ton protocole.</div>

  <input type="text" id="code" placeholder="Ton code d'accès (ex : AXE-...)" autocomplete="off">
  <button id="btn" onclick="verifier()">Ouvrir mon protocole</button>

  <div class="msg" id="msg"></div>

  <div class="hint">
    Tu as reçu ton code par email après ton inscription.<br>
    Une question ? Écris à ton préparateur.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== CONFIG (clé publique anon, prévue pour être visible) ======
const SUPABASE_URL = 'https://ilsxrdvxvnvlznjuevba.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlsc3hyZHZ4dm52bHpuanVldmJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NjI3MDMsImV4cCI6MjEwMjMzODcwM30.stJYjKv0bp2qwYk2iW2WxFjP3m8KXNbtZZc49zeuTDk';
// Nom du fichier de ton protocole (à héberger à côté de acces.html)
const FICHIER_PROTOCOLE = 'protocole-axe-mental-performance.html';
// ==================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');

// Permet aussi d'ouvrir directement avec ?code=... dans l'adresse
const params = new URLSearchParams(window.location.search);
if(params.get('code')){
  document.getElementById('code').value = params.get('code');
}

// Entrée clavier = valider
document.getElementById('code').addEventListener('keydown', e=>{ if(e.key==='Enter') verifier(); });

async function verifier(){
  const code = document.getElementById('code').value.trim();
  msg.className='msg';
  msg.textContent='';
  if(!code){ msg.className='msg err'; msg.textContent="Entre ton code d'accès."; return; }

  btn.disabled = true;
  msg.textContent = 'Vérification en cours...';

  try{
    const { data, error } = await sb.rpc('verifier_acces', { code: code });
    if(error){ throw error; }

    // data est un tableau : vide si le code n'existe pas
    if(!data || data.length === 0){
      msg.className='msg err';
      msg.textContent = "Ce code d'accès n'existe pas. Vérifie ta saisie.";
      btn.disabled = false;
      return;
    }

    const ligne = data[0];
    if(ligne.actif === true){
      msg.className='msg ok';
      // on mémorise le code pour la session
      sessionStorage.setItem('axe_code', code);

      // ===== AIGUILLAGE : diagnostic ou programme ? =====
      // date_diag vide => jamais fait => diagnostic (1re connexion)
      // date_diag > 3 mois => diagnostic obligatoire (rendez-vous trimestriel)
      // sinon => accès direct au programme
      let etape = 'programme';
      if(!ligne.date_diag){
        etape = 'diagnostic';
      } else {
        const dernier = new Date(ligne.date_diag);
        const troisMois = new Date();
        troisMois.setMonth(troisMois.getMonth() - 3);
        if(dernier < troisMois){ etape = 'diagnostic'; }
      }

      if(etape === 'diagnostic'){
        msg.textContent = 'Accès validé. Direction ton diagnostic...';
      } else {
        msg.textContent = 'Accès validé. Ouverture de ton programme...';
      }
      // on passe le code ET l'étape au protocole via l'adresse
      setTimeout(()=>{
        window.location.href = FICHIER_PROTOCOLE + '?code=' + encodeURIComponent(code) + '&etape=' + etape;
      }, 800);
    } else {
      msg.className='msg err';
      msg.textContent = "Ton accès a expiré ou n'est plus actif. Contacte ton préparateur pour le renouveler.";
      btn.disabled = false;
    }
  }catch(e){
    msg.className='msg err';
    msg.textContent = "Un souci est survenu. Réessaie dans un instant.";
    btn.disabled = false;
  }
}
</script>
</body>
</html>
